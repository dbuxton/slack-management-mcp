# Slack app manifest for slack-management-mcp.
#
# Create the app: https://api.slack.com/apps -> "Create New App" -> "From a manifest"
# Paste this file, then either:
#   * install the app and copy the Bot User OAuth Token (xoxb-) into
#     SLACK_BOT_TOKEN, or
#   * copy the Client ID and Client Secret and run `slack-management-mcp login`
#     so the server acts as your user (xoxp-).
# The redirect URL below must stay in sync with the login command's default.
display_information:
  name: Slack Management MCP
  description: Manage Slack users, channels, user groups, canvases and lists.

features:
  bot_user:
    display_name: slack-management-mcp
    always_online: false

oauth_config:
  redirect_urls:
    - http://127.0.0.1:8765/callback
  scopes:
    user:
      - users:read              # look up users (users.info)
      - users:read.email        # look up users by email (users.lookupByEmail)
      - channels:read           # list / read public channels
      - groups:read             # list / read private channels the user is in
      - channels:write.invites  # invite users to public channels
      - groups:write.invites    # invite users to private channels
      - usergroups:read         # list / read user groups (usergroups.list)
      - usergroups:write        # update user group membership (usergroups.users.update)
      - canvases:read           # find canvas sections
      - canvases:write          # create, edit, delete and share canvases
      - lists:read              # read list rows and schema
      - lists:write             # create, update and share lists; manage rows
    bot:
      - users:read         # look up users (users.info)
      - users:read.email   # look up users by email (users.lookupByEmail)
      - channels:read      # list / read public channels
      - groups:read        # list / read private channels the bot is in
      - channels:manage    # invite users to public channels
      - groups:write       # invite users to private channels
      - channels:join      # let the bot self-join public channels before inviting
      - usergroups:read    # list / read user groups (usergroups.list)
      - usergroups:write   # update user group membership (usergroups.users.update)
      - canvases:read      # find canvas sections
      - canvases:write     # create, edit, delete and share canvases
      - lists:read         # read list rows and schema
      - lists:write        # create, update and share lists; manage rows

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
